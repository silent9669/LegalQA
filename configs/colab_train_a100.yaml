profile_name: colab_train_a100
target_hardware: "NVIDIA A100"
seed: 42

devices:
  generator: "cuda:0"
  retrieval: "cuda:0"

data:
  dataset_slug: "phucdangg/legalqa-task2-clean-data"
  runtime_root: "/content/data/legalqa-task2-clean-data"
  max_seq_len: 2048

generator:
  model_id: "Qwen/Qwen2.5-3B-Instruct"
  load_in_4bit: false
  torch_dtype: "bfloat16"
  use_liger_kernel: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  learning_rate: 2.0e-4
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_ratio: 0.05
  logging_steps: 10
  save_strategy: "epoch"
  save_total_limit: 2

huggingface:
  repo_id: "dangphuc2109/legalqa-qwen2.5-3b-adapter"
  private: true
  upload_run_bundle: true
