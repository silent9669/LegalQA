# Task 2 LegalQA Pipeline Configuration (Reference/Legacy Specification)
# NOTE: Active authoritative configurations are:
# - configs/runtime_api.yaml          -> Runtime API Contract (API 16)
# - configs/models.yaml               -> Model identities and parameter accounting (<4B limit)
# - configs/pipeline.yaml             -> Infrastructure and runtime pipeline defaults
# - configs/production_selection.yaml -> Empirical Protocol-8 promoted decisions

task:
  name: "Task 2 - LegalQA"
  version: "16.0.0"
  metric: "METEOR"
  parameter_limit: 4000000000

paths:
  raw_contexts: "artifacts/raw/selected-contexts"
  train_json: "artifacts/raw/train.json"
  warmup_json: "artifacts/raw/warmup.json"
  public_test_json: "artifacts/raw/public-official.json"
  data_dir: "artifacts/task2/data"
  index_dir: "artifacts/task2/indexes"
  checkpoint_dir: "artifacts/task2/checkpoints"
  submission_dir: "artifacts/task2/submissions"

models:
  retriever:
    name: "CODE4LIFEOFFICIAL/huydang-dek21-embedding-v2"
    dimension: 768
    word_segmentation: "pyvi"
    top_k: 50
  reranker:
    name: "BAAI/bge-reranker-v2-m3"
    top_k: 8
  generator:
    name: "Qwen/Qwen2.5-3B-Instruct"
    max_new_tokens: 384
    lora_r: 16
    lora_alpha: 32

retrieval:
  bm25:
    k1: 1.5
    b: 0.75
    legal_boosting: true
  rrf:
    k: 60
    weights: [0.5, 0.5]
