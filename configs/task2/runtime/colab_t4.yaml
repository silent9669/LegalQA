profile_name: colab_t4
required_gpu_count: 1
required_gpu_name_contains: T4
devices:
  generator: cuda:0
  retrieval: cuda:0
generator_runtime:
  compute_dtype: float16
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  activation_offloading: true
smoke:
  optimizer_steps: 5
  mini_eval_samples: 5
outputs:
  report_path: /content/legalqa_run/colab_t4_report.json
  log_path: /content/legalqa_run/colab_t4.log
  telemetry_path: /content/legalqa_run/colab_t4_telemetry.json
