profile_name: modal_a100
required_gpu_count: 1
required_gpu_name_contains: A100
devices:
  generator: cuda:0
  retrieval: cuda:0
generator_runtime:
  compute_dtype: bfloat16
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  activation_offloading: false
a100_micro_probe:
  optimizer_steps: 2
production:
  full_train: true
# Runtime-only batching (greedy decoding: no score effect). A100-40GB headroom
# per fix/02: gen batch 16 (~14.2 GB), rerank batch 128 (~7.8 GB).
inference:
  generation_batch_size: 16
  reranker_batch_size: 128
  retrieval_batch_size: 32
  generator_load_mode: bfloat16
  merge_adapter: true
  max_new_tokens: 1536
  best_fixed_candidate: dual_assembled
outputs:
  report_path: /root/legalqa_run/modal_a100_report.json
  log_path: /root/legalqa_run/modal_a100.log
  telemetry_path: /root/legalqa_run/modal_a100_telemetry.json
