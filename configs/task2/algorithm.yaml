schema_version: 1
seed: 42

models:
  generator:
    id: Qwen/Qwen2.5-3B-Instruct
    revision_policy: exact_commit
  reranker:
    id: BAAI/bge-reranker-v2-m3
    revision_policy: exact_commit
  dense:
    id: CODE4LIFEOFFICIAL/huydang-dek21-embedding-v2
    revision_policy: exact_commit

generator:
  max_seq_len: 2048
  quantization: 4bit_nf4
  double_quant: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  effective_batch_size: 8
  num_train_epochs: 1
  completion_only_loss: true
  use_liger_fused_ce: true
  gradient_checkpointing: true

# Retrieval recipe (score-affecting; hashed into the candidate).
# Prescribed by fix/03 (Modal scale-down): legal-reference arm + weighted
# RRF + article diversification. Acronym expansion and lost-in-middle stay
# off pending A/B evidence. One full epoch per fix/02 timing envelope.
retrieval:
  rrf_k: 60
  candidate_pool: 50
  use_legal_reference: true
  use_acronyms: false
  use_weighted_rrf: true
  diversify_context: true
  lost_in_middle: false
  max_parts_per_article: 2
  w_bm25_plain: 0.55
  w_dense_plain: 0.45
  w_bm25_lex: 0.40
  w_dense_lex: 0.27
  w_lexref_lex: 0.33

final_training:
  training_scope: all_allowed_train
  val_fold: null

evaluation:
  primary_metric: whitespace_meteor
  secondary_metric: rouge_l
