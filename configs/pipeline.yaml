seed: 42

data:
  train_path: "artifacts/raw/train.json"
  warmup_path: "artifacts/raw/warmup.json"
  public_path: "artifacts/raw/public-official.json"
  contexts_dir: "artifacts/raw/selected-contexts"
  canonical_qa: "artifacts/data/qa_unique.parquet"
  known_qa_memory: "artifacts/data/known_qa.json"
  legal_chunks: "artifacts/chunks/legal_chunks.parquet"
  retrieval_labels: "artifacts/labels/retrieval_labels.parquet"

chunking:
  mode: hybrid
  target_tokens: 600
  overlap_tokens: 80

retrieval:
  lexical: bm25
  dense_model: "CODE4LIFEOFFICIAL/huydang-dek21-embedding-v2"
  document_topk: 20
  chunk_topk_before_rerank: 50
  fusion: rrf
  rrf_k: 60

reranking:
  enabled: true
  model: "BAAI/bge-reranker-v2-m3"
  evidence_topk: 8

generation:
  model: "Qwen/Qwen2.5-3B-Instruct"
  max_new_tokens: 384
  temperature: 0.0
  do_sample: false
  use_provision_memory: true

postprocess:
  article_stitching: true
  source_snap: true
  extractive_candidate: true

selector:
  type: rules
