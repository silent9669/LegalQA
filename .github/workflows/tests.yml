name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: CPU Test Suite & Runtime Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml pytest pytest-cov

      - name: Install Kaggle runtime compatibility stack (PEFT, TRL, Transformers)
        run: |
          pip install transformers peft trl bitsandbytes accelerate

      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('wordnet'); nltk.download('omw-1.4')"

      - name: Verify runtime import bootstrap
        run: |
          python scripts/bootstrap_kaggle_env.py

      - name: Run test suite
        run: |
          pytest tests/ -v
