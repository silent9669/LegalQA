name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    name: CPU Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml pytest pytest-cov

      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('wordnet'); nltk.download('omw-1.4')"

      - name: Run test suite
        run: |
          pytest tests/ -v

  bootstrap-protection:
    name: Bootstrap Protected-Version Preservation Proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install fixed PyTorch CPU fixture
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Record PyTorch version before bootstrap
        id: pre_version
        run: |
          TORCH_PRE=$(python -c "import torch; print(torch.__version__)")
          echo "torch_pre=$TORCH_PRE" >> $GITHUB_OUTPUT
          echo "Preinstalled PyTorch version: $TORCH_PRE"

      - name: Run dependency bootstrap
        run: |
          pip install pyyaml pytest packaging
          python scripts/bootstrap_kaggle_env.py

      - name: Assert exact PyTorch preservation
        run: |
          TORCH_POST=$(python -c "import torch; print(torch.__version__)")
          echo "Post-bootstrap PyTorch version: $TORCH_POST"
          if [ "$TORCH_POST" != "${{ steps.pre_version.outputs.torch_pre }}" ]; then
            echo "ERROR: Protected PyTorch was modified during bootstrap!"
            exit 1
          fi
          echo "SUCCESS: Protected PyTorch version preserved exactly ($TORCH_POST)."

      - name: Run runtime integrity tests
        run: |
          pytest tests/test_v7_runtime_integrity.py tests/test_v8_fail_loud_integration.py -v

  training-api-compat:
    name: SFT Training API & Module Compatibility (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install minimum supported TRL contract
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml pytest packaging
          pip install "trl==0.17.0" transformers peft bitsandbytes accelerate

      - name: Verify SFT completion_only_loss and processing_class API
        run: |
          python - <<'PY'
          import inspect
          from trl import SFTConfig, SFTTrainer

          sc = inspect.signature(SFTConfig)
          st = inspect.signature(SFTTrainer)
          assert "completion_only_loss" in sc.parameters, "SFTConfig missing completion_only_loss"
          assert "max_length" in sc.parameters or "max_seq_length" in sc.parameters, "SFTConfig missing max_length/max_seq_length"
          assert "processing_class" in st.parameters, "SFTTrainer missing processing_class"
          print("MINIMUM TRL API CONTRACT PASS")
          PY
          python -c "import src.task2.training.train_generator as tg; assert not hasattr(tg, 'DataCollatorForCompletionOnlyLM')"
          python -c "from src.task2.training.train_generator import build_sft_config, build_grounded_training_examples"

      - name: Run promotion consistency, training, and dependency contract tests
        run: |
          pytest \
            tests/test_v7_promotion_consistency.py \
            tests/test_v8_promotion_provenance.py \
            tests/test_generator_training_data.py \
            tests/test_v11_dependency_contract.py \
            -v
